[project]
name = "backend"
version = "0.1.0"
description = "Minimal FastAPI and PostgreSQL message board"
readme = "README.md"
authors = [
    { name = "baili-ren", email = "1139543453@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
